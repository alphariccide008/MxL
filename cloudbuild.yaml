steps:
  - # Build image
    name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "europe-west2-docker.pkg.dev/infrastructure-public/tef-website/cloudbuild",
        ".",
      ] 

  - # Push container image to artifact registry
    name: 'gcr.io/cloud-builders/docker'
    args: 
      [
        'push', 'europe-west2-docker.pkg.dev/infrastructure-public/tef-website/cloudbuild'
      ]

  - # Deploy to cloud run
    name: "gcr.io/cloud-builders/gcloud"
    args: 
      [
        'run',
        'deploy', 'tef-website',
        '--image', 'europe-west2-docker.pkg.dev/infrastructure-public/tef-website/cloudbuild',
        '--region', 'europe-west2',
        '--platform', 'managed',
        '--allow-unauthenticated',
        '--port', '5000'
      ]
