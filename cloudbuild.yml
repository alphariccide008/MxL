steps:
- name: gcr.io/cloud-builders/docker:latest
  args: ['build','-t', 'gcr.io/infrastructure-public/tef-website:${_TAG}', '-f', 'Dockerfile', '.']
  id: build
- name: gcr.io/cloud-builders/docker
  args: ['push', 'gcr.io/infrastructure-public/tef-website:${_TAG}']
  waitFor: ['build']
  id: push
- name: google/cloud-sdk
  args: ['gcloud', 'run', 'deploy', 'tef-website',
         '--image', 'gcr.io/infrastructure-public/tef-website:${_TAG}',
         '--region', 'europe-west2',
         '--platform', 'managed',
         '--port', '80',
         '--allow-unauthenticated'
  ]
  id: deploy
  waitFor: ['push']
images: [
  'gcr.io/infrastructure-public/<Name_of_image>:${_TAG}'
]
substitutions:
  _TAG: latest
